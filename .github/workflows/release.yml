name: Release

on:
  push:
    branches: [main]

jobs:
  # ── 1. Check if this version has been released already ──────────────────────
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_new:  ${{ steps.tag_check.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: ver
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.ver.outputs.version }}$"; then
            echo "is_new=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.ver.outputs.version }} already exists — skipping release."
          else
            echo "is_new=true" >> $GITHUB_OUTPUT
            echo "New version v${{ steps.ver.outputs.version }} — will release."
          fi

  # ── 2. Build binaries for all platforms ─────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.is_new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""

          - os: macos-latest       # arm64 (M1/M2/M3)
            target: aarch64-apple-darwin
            ext: ""

          - os: macos-13           # Intel
            target: x86_64-apple-darwin
            ext: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/todo${{ matrix.ext }} \
             dist/todo-${{ matrix.target }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/

  # ── 3. Tag, cut a GitHub release, attach binaries ───────────────────────────
  release:
    name: GitHub release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.check.outputs.version }}
          git push origin v${{ needs.check.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:              v${{ needs.check.outputs.version }}
          name:                  v${{ needs.check.outputs.version }}
          files:                 dist/**
          generate_release_notes: true

  # ── 4. Publish to crates.io ──────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
