[package]
name        = "rs-todo"
version     = "0.1.0"
edition     = "2021"
description = "A lightweight, encrypted terminal todo app with a TUI viewer"
license     = "MIT"
repository  = "https://github.com/nagendraallam/rs-todo"
keywords    = ["todo", "cli", "tui", "terminal", "productivity"]
categories  = ["command-line-utilities"]
exclude     = [".github", ".gitignore"]

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm  = "0.27"
dirs       = "5"
reqwest = { version = "0.13.3", features = ["blocking", "json", "rustls", "form"] }
url = "2.5.8"
rand = "0.10.1"
unicode-width = "0.2"
